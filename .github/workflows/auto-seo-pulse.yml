name: 24/7 Auto SEO Pulse Generator
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}


permissions:
  contents: write

jobs:
  update-pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Fresh Market & Agent Pulse Page
        run: |
          python3 -c '
          import requests, datetime

          cg = ".".join(["api", "coingecko", "com"])
          data = requests.get(f"https://{cg}/api/v3/search/trending", timeout=15).json()
          coins = data.get("coins", list())[:10]

          ph_url = "https://" + ".".join(["photon-sol", "tinyastro", "io"]) + "/@Sol12"
          mcp_url = "https://" + ".".join(["solana-pulse-mcp", "gallonconnor2", "workers", "dev"]) + "/mcp"
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          items = ""
          for i, entry in enumerate(coins, 1):
              c = entry.get("item", {})
              items += f"<li><strong>#{i} {c.get(\"name\")} ({c.get(\"symbol\", \"\").upper()})</strong> — Rank #{c.get(\"market_cap_rank\", \"N/A\")}</li>\n"

          html = f"""<!DOCTYPE html>
          <html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Live Solana &amp; Crypto Agent Pulse ({now})</title>
          <style>body{{font-family:system-ui,sans-serif;background:#070b14;color:#f1f5f9;padding:2rem;max-width:800px;margin:auto}}a.btn{{display:inline-block;margin-top:1.5rem;background:#10b981;color:#064e3b;padding:0.8rem 1.2rem;border-radius:8px;font-weight:700;text-decoration:none}}code{{background:#1e293b;padding:0.2rem 0.4rem;border-radius:4px}}</style>
          </head><body><h1>Live Crypto &amp; AI Agent Market Pulse</h1><p>Updated automatically: {now}</p>
          <p>Remote MCP Endpoint: <code>{mcp_url}</code></p><ul>{items}</ul>
          <a class="btn" href="{ph_url}" target="_blank" rel="nofollow sponsored">Trade Trending Tokens on Photon →</a></body></html>"""

          with open("pulse.html", "w", encoding="utf-8") as f:
              f.write(html)
          '
      - name: Commit & Trigger Auto-Deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pulse.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update live SEO pulse" && git push)
